# Use this to run locally but connect to Ubuntu server MySQL via SSH tunnel.
#
# ─── SETUP STEPS ───────────────────────────────────────
#   Step 1: Open SSH tunnel in a PowerShell window (keep it open):
#     ssh -L 3307:localhost:3306 rdaivam@10.240.150.65 -N
#
#   Step 2: Run the app with this profile:
#     mvn spring-boot:run -Dspring-boot.run.profiles=devserver
