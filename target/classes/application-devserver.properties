# ----- BASE URL ---------------------------------------------------------------
app.base-url=http://localhost:8080

# ----- DATABASE (Server MySQL via SSH tunnel) ---------------------------------
# SSH tunnel maps Windows:3307 → Ubuntu server MySQL:3306
# Open tunnel first: ssh -L 3307:localhost:3306 rdaivam@10.240.150.65 -N
spring.datasource.url=jdbc:mysql://127.0.0.1:3307/hr_intranet_portal?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=hrportal
spring.datasource.password=HRPortal@2026!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----- FILE PATHS (local) -----------------------------------------------------
# Uploads and gallery resolve from project root when running via mvn spring-boot:run
app.upload.dir=uploads/images
app.gallery.dir=src/main/webapp/images/gallery

# ----- CORS -------------------------------------------------------------------
app.cors.allowed-origins=http://localhost:*,http://127.0.0.1:*,file://*

# ----- JWT --------------------------------------------------------------------
app.jwt.secret=/DoMnlbFXRYK+4ZEa0yE9DUc1eDShmHGKp3hlUzstTGA457XpY4CZPXfxn7kbfj64MhQZ+5f7K1jI/z2r5NjXw==
app.jwt.expiration-ms=86400000

# ----- LOGGING (verbose for dev) -----------------------------------------------
spring.jpa.show-sql=true
logging.level.root=INFO
