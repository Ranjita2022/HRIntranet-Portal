# ============================================
# HR Intranet Portal - DEVELOPMENT Profile
# Active when: spring.profiles.active=dev
# ============================================

# Base URL for local development
app.base-url=http://localhost:8080

# Allow requests from localhost (browser, UI dev server on port 3000, file:// for testing)
app.cors.allowed-origins=http://localhost:*,http://127.0.0.1:*,file://*

# ----- FILE PATHS (dev) -------------------------------------------------------
# Both paths below are relative — resolved from the project root when running
# via 'mvn spring-boot:run' or the IDE (user.dir = project root).
#
#   uploads/images  → {project.root}/uploads/images/   (employee photo uploads)
#   images/gallery  → {project.root}/images/gallery/   (gallery album folders — source tree)
#
# These values are inherited from application.properties; listed here for visibility.
# app.upload.dir=uploads/images       ← inherited default
# app.gallery.dir=images/gallery      ← inherited default
# ------------------------------------------------------------------------------

# Show SQL and verbose logging in dev
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.web=DEBUG
logging.level.org.ieee.hrintranet=DEBUG
