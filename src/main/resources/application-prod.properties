# ============================================
# HR Intranet Portal - PRODUCTION Profile
# Ubuntu 22.04 LTS · Single-Server · Internal Intranet
#
# ─── HOW TO ACTIVATE ───────────────────────────────────
#   Option A (recommended) — startup flag:
#     java -jar ROOT.war --spring.profiles.active=prod
#
#   Option B — environment variable (add to /etc/environment):
#     SPRING_PROFILES_ACTIVE=prod
#
#   Option C — systemd service (add to [Service] section):
#     Environment="SPRING_PROFILES_ACTIVE=prod"
# ────────────────────────────────────────────────────────
# ============================================

# ----- SERVER BASE URL --------------------------------------------------------
# Replace YOUR_SERVER_IP with the actual Ubuntu server IP address (e.g. 10.240.147.x).
# Once internal DNS is set up, switch to a hostname instead:
#   app.base-url=http://hr-portal.ieee-internal.org
# ------------------------------------------------------------------------------
# Use DNS hostname instead of IP once IT sets up DNS.
# For now, using the server IP address directly.
app.base-url=http://10.240.150.65

# ----- DATABASE ---------------------------------------------------------------
# MySQL is installed on the SAME Ubuntu server as Tomcat (100 GB HDD, single-server
# deployment). 'localhost:3306' is correct — do NOT change to a remote host unless
# you move MySQL to a separate machine in the future.
#
# ► Credentials: use the dedicated 'hrportal' DB user (NOT root) created in
#   DEPLOY-LINUX.md → Step 4.  Replace CHANGE_ME_... with your actual password.
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/hr_intranet_portal?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=hrportal
spring.datasource.password=ENC(L2kyrlPOAX06kvxjOJdWh1ZeJeOSxAGN)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool — tune if you see "Too many connections" errors
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ----- FILE UPLOADS -----------------------------------------------------------
# Uploaded employee photos are stored here ON THE SERVER DISK (100 GB HDD).
# This path is OUTSIDE the WAR so photos survive re-deployments.
# The 'hrintranet' system user must own this directory:
#   sudo mkdir -p /opt/hrintranet/uploads/images
#   sudo chown -R hrintranet:hrintranet /opt/hrintranet/uploads
# ------------------------------------------------------------------------------
app.upload.dir=/opt/hrintranet/uploads/images

# ----- GALLERY IMAGES ---------------------------------------------------------
# Gallery photos are served as static files from this directory ON THE SERVER HDD.
# This path is OUTSIDE the WAR — gallery albums survive every re-deployment.
#
# Spring serves GET /images/gallery/** directly from this directory via a
# resource handler configured in WebConfig.java. No symlink or WAR bundling needed.
#
# First-time setup: after the WAR is first extracted, copy the bundled seed albums
# out of the WAR into this directory (see DEPLOY-LINUX.md → Step 9.3).
# ------------------------------------------------------------------------------
app.gallery.dir=/opt/hrintranet/gallery

# ----- CORS -------------------------------------------------------------------
# Replace YOUR_SERVER_IP with the actual Ubuntu server IP address.
# Add more origins if admin workstations access the portal from specific IPs.
# ------------------------------------------------------------------------------
app.cors.allowed-origins=http://10.240.150.65:*,http://localhost:*

# ----- CAREERS URL ------------------------------------------------------------
app.careers-url=https://ieee.taleo.net/careersection/1/jobsearch.ftl

# ----- JPA / HIBERNATE --------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ----- JWT --------------------------------------------------------------------
# IMPORTANT: Generate a strong random secret before going live.
# Run on the Ubuntu server:  openssl rand -base64 64
# Paste the output below (remove newlines).
# ------------------------------------------------------------------------------
app.jwt.secret=ENC(TFqwY7gxOgMSkbPmV3lulRp7m+EJ3NKzbic3Icw486P0q4Vt2lxrIHin3v5t1k2ERcWN21vPADUOfBnFqfhK3o1r66TnSwsi7R3s1Hp8TSDtA76pir+RSIOjxwh35Bv/glJ1CLdZ3tk=)
app.jwt.expiration-ms=86400000

# ----- LOGGING ----------------------------------------------------------------
logging.level.root=WARN
logging.level.org.ieee.hrintranet=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Log file — written to a persistent directory on the 100 GB HDD.
# The directory is created automatically by Tomcat/Spring on first run.
logging.file.name=/opt/hrintranet/logs/app.log
logging.file.max-size=50MB
logging.file.max-history=30
