# ============================================
# HR Intranet Portal - Application Configuration
# ============================================

# Server Configuration
server.port=8080
# server.servlet.context-path=/api  (DO NOT enable - WebConfig.addPathPrefix handles /api)
server.tomcat.use-native-library=false

# ── Jasypt Encryption ─────────────────────────────────
# Master password is provided via environment variable: JASYPT_ENCRYPTOR_PASSWORD
# Never commit the master password. Set it on the server or in IDE run config.
jasypt.encryptor.algorithm=PBEWithMD5AndDES
jasypt.encryptor.iv-generator-classname=org.jasypt.iv.NoIvGenerator

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/hr_intranet_portal?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=test
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Logging Configuration
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.company.hrintranet=DEBUG
logging.level.org.springframework.web=DEBUG

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Custom Application Properties
app.upload.dir=uploads/images
app.gallery.dir=src/main/webapp/images/gallery
app.upload.allowed-types=image/jpeg,image/jpg,image/png,image/gif,image/webp
app.upload.max-dimension=4000

# Daily quote proxy configuration
app.quotes.api-url=https://zenquotes.io/api/random
# app.quotes.api-url=https://dummyjson.com/quotes/random
app.quotes.timeout-ms=5000
app.quotes.user-agent=IEEE-HR-Intranet-Portal/1.0
app.quotes.wikipedia.summary-url-template=https://en.wikipedia.org/api/rest_v1/page/summary/%s

# JWT Configuration
app.jwt.secret=ENC(TFqwY7gxOgMSkbPmV3lulRp7m+EJ3NKzbic3Icw486P0q4Vt2lxrIHin3v5t1k2ERcWN21vPADUOfBnFqfhK3o1r66TnSwsi7R3s1Hp8TSDtA76pir+RSIOjxwh35Bv/glJ1CLdZ3tk=)
app.jwt.expiration-ms=86400000

# CORS Configuration
app.cors.allowed-origins=http://localhost:*,http://127.0.0.1:*,file://*
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true

# Logging
logging.level.root=INFO
logging.level.com.company.hrintranet=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Date Format
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
